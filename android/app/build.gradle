plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def flutterVersionCode = '5'
def flutterVersionName = '0.5.0'

android { namespace 'sd.fastdelivery.app'; compileSdk flutter.compileSdkVersion
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig { applicationId 'sd.fastdelivery.app'; minSdk 23; targetSdk flutter.targetSdkVersion; versionCode flutterVersionCode.toInteger(); versionName flutterVersionName }
    flavorDimensions 'app'
    productFlavors {
        customer { dimension 'app'; applicationIdSuffix '.customer' }
        captain { dimension 'app'; applicationIdSuffix '.captain' }
        admin { dimension 'app'; applicationIdSuffix '.admin' }
    }
}

flutter { source '../..' }
