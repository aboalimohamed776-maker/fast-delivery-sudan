plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android { namespace 'sd.fastdelivery.app'; compileSdk flutter.compileSdkVersion
    defaultConfig { applicationId 'sd.fastdelivery.app'; minSdk flutter.minSdkVersion; targetSdk flutter.targetSdkVersion; versionCode flutterVersionCode.toInteger(); versionName flutterVersionName }
    flavorDimensions 'app'
    productFlavors {
        customer { dimension 'app'; applicationIdSuffix '.customer' }
        captain { dimension 'app'; applicationIdSuffix '.captain' }
        admin { dimension 'app'; applicationIdSuffix '.admin' }
    }
}

flutter { source '../..' }
