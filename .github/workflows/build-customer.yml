name: Build ZoolFast Customer APK v0.5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Precache Android engine artifacts
        run: flutter precache --android
      - name: Ensure Android v2 platform files
        run: flutter create . --platforms=android --project-name zoolfast
      - name: Align Kotlin plugin version
        run: sed -i -E 's/1\.9\.[0-9]+/2.1.0/g' android/settings.gradle
      - name: Upgrade Gradle wrapper for Android plugin
        run: sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.4-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Align Gradle repository mode
        run: sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_SETTINGS/' android/settings.gradle
      - name: Analyze customer app
        run: flutter analyze lib/main_customer.dart lib/features/customer lib/services lib/data/models/restaurant.dart
      - name: Build customer APK
        run: flutter build apk --release -t lib/main_customer.dart
      - name: Upload ZoolFast Customer v0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: ZoolFast-Customer-v05-APK
          path: build/app/outputs/flutter-apk/app-release.apk
