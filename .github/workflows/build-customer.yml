name: Build ZoolFast Customer APK v0.5

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Precache Android engine artifacts
        run: flutter precache --android
      - name: Ensure Android v2 platform files
        run: flutter create . --platforms=android --project-name zoolfast
      - name: Restore tracked Android build configuration
        run: git checkout -- android/build.gradle android/settings.gradle android/app/build.gradle
      - name: Align Kotlin plugin version
        run: grep -rlE '1\.9\.[0-9]+' android | xargs -r sed -i -E 's/1\.9\.[0-9]+/2.1.0/g'
      - name: Upgrade Gradle wrapper for Android plugin
        run: sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.9-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Align Gradle repository mode
        run: sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_SETTINGS/' android/settings.gradle
      - name: Analyze customer app
        run: flutter analyze --no-fatal-infos lib/main_customer.dart lib/features/customer lib/services lib/data/models/restaurant.dart
      - name: Build customer APK
        run: flutter build apk --release --flavor customer -t lib/main_customer.dart
      - name: Verify signed APK
        run: |
          APK=build/app/outputs/flutter-apk/app-customer-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -5
      - name: Upload ZoolFast Customer v0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: ZoolFast-Customer-v05-APK
          path: build/app/outputs/flutter-apk/app-customer-release.apk
      - name: Publish signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/app-customer-release.apk
          gh release view v0.5.0 >/dev/null 2>&1 || gh release create v0.5.0 --title "ZoolFast v0.5.0" --notes "Signed customer APK build."
          gh release upload v0.5.0 "$APK#ZoolFast-Customer-v0.5.0.apk" --clobber
